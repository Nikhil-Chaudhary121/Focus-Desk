<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Focus Desk</title>

<style>
@font-face{font-family:"Press Start 2P";src:url("fonts/PressStart2P.ttf")}
:root,[data-theme=classic]{--bg:#14201f;--panel:#1c2c2a;--line:#2e4441;--text:#e8efe6;--mute:#8fa8a2;--gold:#f2c14e;--water:#6cc0e5;--ok:#7fd1a0;--on-accent:#14201f;--on-water:#0d2530;--r:6px;--r2:10px;--fs:14px;--font:"Segoe UI",system-ui,sans-serif;--hdr:#14201f;--hdr-text:#e8efe6;--shadow:none}
[data-theme=light]{--bg:#f2f4f7;--panel:#ffffff;--line:#d3d9e2;--text:#1b2230;--mute:#65708a;--gold:#2563eb;--water:#0ea5e9;--ok:#16a34a;--on-accent:#ffffff;--on-water:#ffffff;--hdr:#ffffff;--hdr-text:#1b2230}
[data-theme=dark]{--bg:#0e1014;--panel:#171a20;--line:#2a2f39;--text:#e6e9ee;--mute:#8a93a3;--gold:#7c9cff;--water:#4cc3f0;--ok:#5fd394;--on-accent:#0e1014;--on-water:#0e1014;--hdr:#0e1014;--hdr-text:#e6e9ee}
[data-theme=retro]{--bg:#1b2226;--panel:#252d33;--line:#3a9bd0;--text:#dbeaf3;--mute:#7fa6bd;--gold:#e63946;--water:#f5b25c;--ok:#6ee7a0;--on-accent:#ffffff;--on-water:#3a2a10;--r:0px;--r2:0px;--fs:12px;--font:"Press Start 2P","Courier New",monospace;--hdr:#2f86b8;--hdr-text:#ffffff;--shadow:4px 4px 0 #0b1013}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:var(--fs)/1.4 var(--font);height:100vh;overflow:hidden}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:var(--r);padding:5px 10px}
button:hover{border-color:var(--gold)}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
button.primary{background:var(--gold);color:var(--on-accent);border-color:var(--gold);font-weight:600}
input,select,textarea{font:inherit;width:auto;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:var(--r);padding:6px 8px}
.muted{color:var(--mute)}.done .t{text-decoration:line-through;color:var(--mute)}
#toast{position:fixed;left:8px;right:8px;bottom:8px;background:var(--water);color:var(--on-water);padding:8px 10px;border-radius:var(--r2);font-weight:600;display:none;z-index:9}
/* main */
.app{display:flex;flex-direction:column;height:100vh}
header{background:var(--hdr);color:var(--hdr-text);display:flex;align-items:center;gap:6px;padding:14px 20px;border-bottom:1px solid var(--line)}
header h1{font-size:18px;margin-right:auto;font-weight:700}
.tab.on{background:var(--gold);color:var(--on-accent);border-color:var(--gold)}
main{flex:1;overflow:auto;padding:20px;max-width:760px;width:100%;margin:0 auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:8px}.grow{flex:1}
.add{margin-bottom:18px}.add .row{margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:2px 9px;color:var(--mute)}
.badge{font-size:12px;border-radius:99px;padding:1px 8px;background:var(--bg);border:1px solid var(--line)}
.badge.doing{border-color:var(--gold);color:var(--gold)}.badge.done{border-color:var(--ok);color:var(--ok)}
.dots{display:flex;gap:4px}.dot{width:12px;height:12px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}.dot.on{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--mute);padding:24px 0;text-align:center}
textarea{width:100%;margin-top:8px;resize:vertical}
.timer{text-align:center;padding:30px 14px}.timer .big{font-size:76px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;margin:6px 0 18px}
.timer .row{justify-content:center}.mode-focus .big{color:var(--gold)}.mode-break .big{color:var(--water)}
.themes{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.theme{display:flex;align-items:center;gap:8px;padding:8px}.theme.on{border:2px solid var(--gold)}
.sw{width:22px;height:22px;border:1px solid var(--line);flex:none}
[data-theme=retro] body{border:6px solid #2f86b8}
[data-theme=retro] body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
[data-theme=retro] .card{border:3px solid var(--line);box-shadow:var(--shadow)}
[data-theme=retro] button{border-width:2px;box-shadow:2px 2px 0 #0b1013}
[data-theme=retro] button:active{transform:translate(2px,2px);box-shadow:none}
[data-theme=retro] header,[data-theme=retro] .w .bar{border-bottom:4px solid #0b1013}
[data-theme=retro] .chip,[data-theme=retro] .badge,[data-theme=retro] .dot{border-radius:0}
[data-theme=retro] .timer .big{font-size:52px}
[data-theme=retro] h1{font-size:14px}
[data-theme=light] .card,[data-theme=light] button{box-shadow:0 1px 2px rgba(20,30,50,.08)}
/* widget */
.w{display:flex;flex-direction:column;height:100vh}
.w .bar{background:var(--hdr);color:var(--hdr-text);display:flex;align-items:center;gap:6px;padding:8px 10px;height:44px;border-bottom:1px solid var(--line);-webkit-app-region:drag;flex:none}
.w .bar b{flex:1}.w .bar button{-webkit-app-region:no-drag;padding:2px 8px}
.w .body{flex:1;overflow:auto;padding:8px 10px}
.w h3{font-size:12px;color:var(--mute);font-weight:600;margin:8px 0 4px}
.w .item{display:flex;align-items:center;gap:6px;padding:5px 0;border-bottom:1px solid var(--line)}
.w .item .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .item button{padding:1px 8px;font-size:12px}
</style>
</head>
<body>
<div id="root"></div>
<div id="toast">Time to drink water</div>
<script>
const view = new URLSearchParams(location.search).get('view');
let data = { tasks: [], habits: [], settings: { waterMins: 60 } };
let pomo = { mode: 'focus', remaining: 1500, running: false, sessions: 0 };
let tab = 'tasks', draftItems = [], collapsed = false;
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const dayKey = (d = new Date()) => { const z = new Date(d); z.setMinutes(z.getMinutes() - z.getTimezoneOffset()); return z.toISOString().slice(0, 10); };
const today = () => dayKey();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const save = () => { window.api.save(data); render(); };

const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const modeName = { focus: 'Focus', break: 'Short break', long: 'Long break' };
const THEMES = [['classic', 'Classic', '#14201f', '#f2c14e'], ['light', 'Light', '#ffffff', '#2563eb'], ['dark', 'Dark', '#0e1014', '#7c9cff'], ['retro', 'Retro arcade', '#2f86b8', '#e63946']];
function setTheme(t) { data.settings.theme = t; save(); }
function saveSettings() {
  const s = data.settings, n = (id, d) => Math.max(1, +$(id).value || d);
  s.waterMins = n('#wMins', 60); s.focusMins = n('#fMins', 25); s.breakMins = n('#bMins', 5); s.longBreakMins = n('#lMins', 15);
  s.autoStart = $('#aOn').checked; s.blockGames = $('#bOn').checked; s.blockOnlyFocus = $('#bFocus').checked;
  s.blockList = $('#bList').value.split('\n').map(x => x.trim()).filter(Boolean);
  save();
}
function streak(h) {
  let n = 0, d = new Date();
  if (!h.log[dayKey(d)]) d.setDate(d.getDate() - 1);
  while (h.log[dayKey(d)]) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function last7(h) {
  return [...Array(7)].map((_, i) => { const d = new Date(); d.setDate(d.getDate() - (6 - i)); return h.log[dayKey(d)] ? 1 : 0; });
}
function startTask(id) {
  const t = data.tasks.find(x => x.id === id); if (!t) return;
  t.status = 'doing'; window.api.launch(t.items); save();
}
function toggleDone(id) {
  const t = data.tasks.find(x => x.id === id);
  t.status = t.status === 'done' ? 'todo' : 'done'; save();
}
function toggleHabit(id) {
  const h = data.habits.find(x => x.id === id);
  if (h.log[today()]) delete h.log[today()]; else h.log[today()] = true; save();
}
function delTask(id) { data.tasks = data.tasks.filter(t => t.id !== id); save(); }
function delHabit(id) { if (confirm('Delete this habit and its history?')) { data.habits = data.habits.filter(h => h.id !== id); save(); } }

function addTask() {
  const title = $('#tTitle').value.trim(); if (!title) return;
  data.tasks.unshift({ id: uid(), title, status: 'todo', items: draftItems });
  draftItems = []; save();
}
function addDraftItem() {
  const v = $('#iVal').value.trim(); if (!v) return;
  draftItems.push({ type: $('#iType').value, value: v }); render(true);
}
function addHabit() {
  const name = $('#hName').value.trim(); if (!name) return;
  data.habits.push({ id: uid(), name, log: {} }); save();
}

const itemChips = t => (t.items || []).map(i => `<span class="chip">${i.type === 'link' ? 'Link' : 'App'}: ${esc(i.value.length > 38 ? i.value.slice(0, 38) + '...' : i.value)}</span>`).join('');

function taskRow(t) {
  const label = { todo: 'To do', doing: 'In progress', done: 'Done' }[t.status];
  return `<div class="card ${t.status === 'done' ? 'done' : ''}">
    <div class="row"><span class="t grow">${esc(t.title)}</span><span class="badge ${t.status}">${label}</span></div>
    ${t.items?.length ? `<div class="chips">${itemChips(t)}</div>` : ''}
    <div class="row" style="margin-top:10px">
      ${t.status !== 'done' ? `<button class="primary" onclick="startTask('${t.id}')">${t.items?.length ? 'Start and open' : 'Start'}</button>` : ''}
      <button onclick="toggleDone('${t.id}')">${t.status === 'done' ? 'Reopen' : 'Mark done'}</button>
      <span class="grow"></span><button onclick="delTask('${t.id}')">Delete</button></div></div>`;
}
function habitRow(h) {
  const done = !!h.log[today()];
  return `<div class="card"><div class="row">
    <input type="checkbox" ${done ? 'checked' : ''} onchange="toggleHabit('${h.id}')" aria-label="Done today">
    <span class="grow">${esc(h.name)}</span>
    <span class="muted">${streak(h)} day streak</span>
    <div class="dots" title="Last 7 days">${last7(h).map(x => `<span class="dot ${x ? 'on' : ''}"></span>`).join('')}</div>
    <button onclick="delHabit('${h.id}')">Delete</button></div></div>`;
}

function renderMain(keepFocus) {
  const tasks = data.tasks, pending = tasks.filter(t => t.status !== 'done'), doneT = tasks.filter(t => t.status === 'done');
  const body = tab === 'tasks' ? `
    <div class="card add">
      <div class="row"><input id="tTitle" class="grow" placeholder="New task, e.g. DSA lecture" onkeydown="if(event.key==='Enter')addTask()"></div>
      <div class="row">
        <select id="iType"><option value="link">Link</option><option value="app">App / command</option></select>
        <input id="iVal" class="grow" placeholder="https://youtube.com/...  or  code  or  chrome" onkeydown="if(event.key==='Enter')addDraftItem()">
        <button onclick="addDraftItem()">Attach</button></div>
      <div class="chips">${draftItems.map(i => `<span class="chip">${i.type}: ${esc(i.value)}</span>`).join('')}</div>
      <div class="row" style="margin-top:10px"><button class="primary" onclick="addTask()">Add task</button></div>
    </div>
    ${pending.length ? pending.map(taskRow).join('') : '<div class="empty">No open tasks. Add one above.</div>'}
    ${doneT.length ? `<h3 class="muted" style="margin:16px 0 8px">Completed</h3>${doneT.map(taskRow).join('')}` : ''}`
  : tab === 'habits' ? `
    <div class="card add"><div class="row"><input id="hName" class="grow" placeholder="New habit, e.g. Read 20 pages" onkeydown="if(event.key==='Enter')addHabit()"><button class="primary" onclick="addHabit()">Add habit</button></div></div>
    ${data.habits.length ? data.habits.map(habitRow).join('') : '<div class="empty">No habits yet. Add one above.</div>'}`
  : tab === 'pomodoro' ? `
    <div class="card timer mode-${pomo.mode === 'focus' ? 'focus' : 'break'}">
      <div class="muted">${modeName[pomo.mode]}</div><div class="big" data-time>${fmt(pomo.remaining)}</div>
      <div class="row"><button class="primary" onclick="window.api.pomo('toggle')">${pomo.running ? 'Pause' : 'Start'}</button>
        <button onclick="window.api.pomo('reset')">Reset</button><button onclick="window.api.pomo('skip')">Skip</button></div>
      <p class="muted" style="margin-top:16px">Focus sessions finished today: ${pomo.sessions}</p></div>`
  : `<div class="card"><div class="themes">${THEMES.map(([id, name, a, b]) => `<button class="theme ${(data.settings.theme || 'classic') === id ? 'on' : ''}" onclick="setTheme('${id}')"><span class="sw" style="background:linear-gradient(90deg,${a} 50%,${b} 50%)"></span>${name}</button>`).join('')}</div></div>
    <div class="card"><div class="row"><span class="grow">Water reminder every</span>
      <input id="wMins" type="number" min="1" value="${data.settings.waterMins}" style="width:80px"><span>minutes</span>
      <button onclick="window.api.testWater()">Test</button></div>
      <p class="muted" style="margin-top:8px">The timer restarts each time you open the app.</p></div>
    <div class="card"><div class="row"><span class="grow">Pomodoro (minutes)</span>
      <label class="muted">Focus <input id="fMins" type="number" min="1" value="${data.settings.focusMins}" style="width:64px"></label>
      <label class="muted">Break <input id="bMins" type="number" min="1" value="${data.settings.breakMins}" style="width:64px"></label>
      <label class="muted">Long <input id="lMins" type="number" min="1" value="${data.settings.longBreakMins}" style="width:64px"></label></div></div>
    <div class="card"><label class="row"><input type="checkbox" id="aOn" ${data.settings.autoStart ? 'checked' : ''}> Start Focus Desk when my PC turns on</label>
      <p class="muted" style="margin-top:6px">Works after you install the app (npm run build). It starts with just the widget; open the full app from the widget.</p></div>
    <div class="card">
      <label class="row"><input type="checkbox" id="bOn" ${data.settings.blockGames ? 'checked' : ''}> Close games as soon as I open them</label>
      <label class="row" style="margin-top:6px"><input type="checkbox" id="bFocus" ${data.settings.blockOnlyFocus ? 'checked' : ''}> Only while a focus session is running</label>
      <textarea id="bList" rows="8">${esc(data.settings.blockList.join('\n'))}</textarea>
      <p class="muted" style="margin-top:6px">One program per line, exactly as shown in Task Manager > Details (for example cs2.exe). Add any game you want blocked.</p></div>
    <button class="primary" onclick="saveSettings()">Save settings</button>`;
  const focusId = keepFocus && document.activeElement?.id, val = focusId && document.activeElement.value;
  $('#root').innerHTML = `<div class="app"><header><h1>Focus Desk</h1>
    ${['tasks', 'habits', 'pomodoro', 'settings'].map(t => `<button class="tab ${tab === t ? 'on' : ''}" onclick="tab='${t}';render()">${t[0].toUpperCase() + t.slice(1)}</button>`).join('')}
    </header><main>${body}</main></div>`;
  if (focusId) { const el = document.getElementById(focusId); if (el) { el.value = val; el.focus(); } }
}

function renderWidget() {
  const pending = data.tasks.filter(t => t.status !== 'done');
  $('#root').innerHTML = `<div class="w"><div class="bar">
    <button onclick="collapsed=!collapsed;window.api.collapse(collapsed);render()" title="${collapsed ? 'Expand' : 'Collapse'}">${collapsed ? '&#9662;' : '&#9652;'}</button>
    <b>Focus Desk</b><span class="muted" data-time>${fmt(pomo.remaining)}</span><button onclick="window.api.pomo('toggle')" title="Start or pause timer">${pomo.running ? '&#10074;&#10074;' : '&#9654;'}</button><button onclick="window.api.openMain()" title="Open full app">Open</button></div>
    ${collapsed ? '' : `<div class="body"><h3>Tasks</h3>
      ${pending.length ? pending.map(t => `<div class="item"><span class="t" title="${esc(t.title)}">${esc(t.title)}</span>
        ${t.status === 'todo' ? `<button onclick="startTask('${t.id}')">Start</button>` : ''}
        <button onclick="toggleDone('${t.id}')">Done</button></div>`).join('') : '<div class="muted">Nothing pending.</div>'}
      <h3>Habits today</h3>
      ${data.habits.length ? data.habits.map(h => `<label class="item"><input type="checkbox" ${h.log[today()] ? 'checked' : ''} onchange="toggleHabit('${h.id}')"><span class="t">${esc(h.name)}</span><span class="muted">${streak(h)}d</span></label>`).join('') : '<div class="muted">No habits yet.</div>'}
    </div>`}</div>`;
}

function render(keep) {
  document.documentElement.dataset.theme = data.settings.theme || 'classic';
  view === 'widget' ? renderWidget() : renderMain(keep); }

let toastTimer;
function showToast() {
  const t = $('#toast'); t.style.display = 'block'; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.style.display = 'none', 15000);
}
$('#toast').onclick = () => $('#toast').style.display = 'none';

(async () => {
  data = await window.api.load();
  data.tasks.forEach(t => t.items = t.items || []);
  pomo = await window.api.pomoGet();
  window.api.onPomo(p => {
    const changed = p.mode !== pomo.mode || p.running !== pomo.running || p.sessions !== pomo.sessions;
    pomo = p;
    document.querySelectorAll('[data-time]').forEach(e => e.textContent = fmt(p.remaining));
    if (changed && (view === 'widget' || tab === 'pomodoro')) render();
  });
  window.api.onChange(d => { data = d; render(); });
  window.api.onWater(showToast);
  render();
})();
</script>
</body>
</html>
